name: ChessPuzzleBot

on:
  schedule:
    # GitHub cron is UTC. Tehran = UTC+3:30 → 10 uploads/day at
    # 00:30, 03:00, 05:30, 08:00, 10:30, 13:00, 15:30, 18:00, 20:30, 23:00 (Tehran)
    - cron: "0 21 * * *"
    - cron: "30 23 * * *"
    - cron: "0 2 * * *"
    - cron: "30 4 * * *"
    - cron: "0 7 * * *"
    - cron: "30 9 * * *"
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 17 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch: {}   # دکمه‌ی Run manually

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system + python deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Restore YouTube login
        run: |
          echo "${{ secrets.TOKEN_PICKLE_B64 }}" | base64 -d > token.pickle
          echo "${{ secrets.CLIENT_SECRETS_B64 }}" | base64 -d > client_secrets.json

      # The 100k validated pool now lives IN THE REPO (puzzles.jsonl).
      # The bot physically prunes it every run and the prune is committed below,
      # so a used puzzle can never come back (no stale cache).
      - name: Rebuild pool only if missing
        run: |
          if [ ! -s puzzles.jsonl ]; then
            python download_puzzles.py
          fi

      - name: Build + upload next batch (slot-aware, quota-aware)
        run: python bot.py --cron

      - name: Persist anti-duplicate memory + numbering state
        run: |
          git config user.name  "chessbot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add used_puzzles.json state.json puzzles.jsonl 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist used-puzzle memory + numbering [skip ci]"
            git push
          else
            echo "nothing new to persist"
          fi
